<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChibiBeasts wardrobe</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101312; color: #f2efdf; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1100px; margin: auto; padding: 24px; }
  header { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  label { display: grid; gap: 6px; flex: 1; min-width: min(100%, 210px); }
  select, button { font: inherit; color: inherit; background: #252c28; border: 1px solid #71806c; border-radius: 6px; padding: 10px 12px; min-height: 44px; }
  select { width: 100%; }
  button:disabled { opacity: .4; }
  button:focus-visible, select:focus-visible { outline: 3px solid #b1d393; outline-offset: 3px; }
  :root[data-background="light"] { color-scheme: light; background: #f5f1e7; color: #242a24; }
  :root[data-background="light"] select, :root[data-background="light"] button { background: #e5e9df; border-color: #76836f; }
  :root[data-background="light"] .count { color: #4b5847; }
  h1 { font-size: 1.4rem; font-weight: 500; margin: 0; }
  .count { color: #c1c9bb; margin: 6px 0 18px; }
  .wardrobe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 16px; }
  figure { margin: 0; min-width: 0; text-align: center; }
  img { display: block; width: 100%; height: 210px; object-fit: contain; image-rendering: pixelated; }
  figcaption { margin-top: 8px; overflow-wrap: anywhere; }
  .unavailable { color: #edc98b; }
  @media (max-width: 620px) { main { padding: 16px; } .wardrobe { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; } img { height: 170px; } }
  @media (max-width: 360px) { img { height: 142px; } }
</style>
<main>
  <header>
    <label for="beast">Beast<select id="beast">__OPTIONS__</select></label>
    <button id="previous" type="button" aria-label="Previous beast">Previous</button>
    <button id="next" type="button" aria-label="Next beast">Next</button>
    <button id="background" type="button" aria-pressed="false">Light background</button>
  </header>
  <h1 id="name"></h1>
  <p id="count" class="count" aria-live="polite"></p>
  <div id="wardrobe" class="wardrobe">__FIGURES__</div>
</main>
<script>
(() => {
  const beasts = __BEASTS__;
  const picker = document.getElementById('beast');
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  const title = document.getElementById('name');
  const count = document.getElementById('count');
  const background = document.getElementById('background');
  const figures = [...document.querySelectorAll('figure[data-armor]')];
  let current = 0;
  function show(index) {
    current = Math.max(0, Math.min(beasts.length - 1, index));
    const beast = beasts[current];
    picker.value = beast.id;
    title.textContent = beast.name;
    count.textContent = `${current + 1} / ${beasts.length} beasts · ${beast.dedicated} / 16 armor looks`;
    previous.disabled = current === 0;
    next.disabled = current === beasts.length - 1;
    figures.forEach(figure => {
      const variant = beast.variants[figure.dataset.armor];
      const image = figure.querySelector('img');
      image.src = variant.src;
      image.alt = `${beast.name} wearing ${figure.dataset.name}${variant.dedicated ? '' : ' (canonical fallback) '}`;
      figure.querySelector('.unavailable').hidden = variant.dedicated;
    });
    history.replaceState(null, '', '#' + beast.id);
  }
  picker.addEventListener('change', () => show(beasts.findIndex(beast => beast.id === picker.value)));
  previous.addEventListener('click', () => show(current - 1));
  next.addEventListener('click', () => show(current + 1));
  background.addEventListener('click', () => {
    const light = background.getAttribute('aria-pressed') !== 'true';
    document.documentElement.dataset.background = light ? 'light' : 'dark';
    background.setAttribute('aria-pressed', String(light));
    background.textContent = light ? 'Dark background' : 'Light background';
  });
  window.addEventListener('hashchange', () => show(beasts.findIndex(beast => beast.id === location.hash.slice(1))));
  const initial = beasts.findIndex(beast => beast.id === location.hash.slice(1));
  show(initial < 0 ? Math.max(0, beasts.findIndex(beast => beast.id === 'prismite')) : initial);
})();
</script>
</html>
