<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beast workspace</title><style>body{margin:0;padding:24px 10px;background:#202126;color:#dbdee1;font:14px/1.5 Arial,sans-serif}main{max-width:760px;margin:auto}header{max-width:640px;margin:0 auto 20px}header p{color:#b5bac1}.beast-art{display:block;max-width:100%;width:240px;max-height:220px;object-fit:contain;image-rendering:pixelated;margin:16px auto}.team-art{width:100%;max-height:none}h1{font-size:24px;font-weight:500}h4{margin-bottom:6px}</style></head><body><main><header><h1>One companion. One message.</h1><p>Open an action, then use Back to beast. These screens come from real callback round trips in a disposable example game.</p></header><style>
#cb-beast-workspace { color-scheme: dark; --cj-bg: light-dark(#f2f3f5, #2b2d31); --cj-ink: light-dark(#303238, #dbdee1); --cj-muted: light-dark(#5c6068, #b5bac1); --cj-button: light-dark(#e3e5e8, #41434a); --cj-border: light-dark(#c4c7ce, #4e5058); --cj-select: light-dark(#fff, #1e1f22); font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5; }
#cb-beast-workspace * { box-sizing: border-box; }
#cb-beast-workspace .cj-stage { padding: 14px 0; }
#cb-beast-workspace .cj-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--cj-muted); padding: 0 12px 12px; }
#cb-beast-workspace .cj-bar select { width: auto; max-width: 100%; }
#cb-beast-workspace .cj-card { max-width: 640px; margin: 0 auto; padding: 12px; border: 1px solid var(--cj-border); border-left: 4px solid #b7ad87; border-radius: 8px; background: var(--cj-bg); color: var(--cj-ink); }
#cb-beast-workspace .cj-gallery img { width: 100%; display: block; image-rendering: pixelated; border-radius: 4px; }
#cb-beast-workspace .cj-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
#cb-beast-workspace button { border: 0; border-radius: 4px; padding: 8px 12px; background: var(--cj-button); color: var(--cj-ink); font: inherit; font-weight: 500; max-width: 100%; }
#cb-beast-workspace button[data-style="1"] { background: #5865f2; color: #fff; }
#cb-beast-workspace button[data-style="3"] { background: light-dark(#257944, #278747); color: #fff; }
#cb-beast-workspace button:disabled { opacity: .5; }
#cb-beast-workspace select { appearance: auto; border: 1px solid var(--cj-border); border-radius: 4px; padding: 10px 8px; background: var(--cj-select); color: var(--cj-ink); font: inherit; width: 100%; min-width: 0; }
#cb-beast-workspace .cj-text { margin: 12px 0; overflow-wrap: anywhere; }
#cb-beast-workspace .cj-text h3 { font-size: 18px; line-height: 1.4; font-weight: 500; color: var(--cj-ink); margin: 0 0 6px; }
#cb-beast-workspace .cj-text strong { font-weight: 500; }
#cb-beast-workspace .cj-section { display: grid; grid-template-columns: 1fr 100px; gap: 14px; align-items: start; }
#cb-beast-workspace .cj-section img { width: 100%; max-height: 100px; object-fit: contain; image-rendering: pixelated; }
#cb-beast-workspace .cj-note { color: var(--cj-muted); padding: 10px 12px 0; min-height: 32px; }
@media (max-width: 420px) { #cb-beast-workspace .cj-section { grid-template-columns: 1fr 78px; gap: 8px; } #cb-beast-workspace button { padding: 8px; } }
@media (pointer: coarse) { #cb-beast-workspace button, #cb-beast-workspace select { min-height: 44px; } #cb-beast-workspace select { font-size: 16px; } }
</style>
<div id="cb-beast-workspace" aria-label="ChibiBeasts beast workspace preview">

</div>
