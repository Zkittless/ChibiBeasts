#cb-journal-flow { color-scheme: dark; --cj-bg: light-dark(#f2f3f5, #2b2d31); --cj-ink: light-dark(#303238, #dbdee1); --cj-muted: light-dark(#5c6068, #b5bac1); --cj-button: light-dark(#e3e5e8, #41434a); --cj-border: light-dark(#c4c7ce, #4e5058); --cj-select: light-dark(#fff, #1e1f22); font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5; }
#cb-journal-flow * { box-sizing: border-box; }
#cb-journal-flow .cj-stage { padding: 14px 0; }
#cb-journal-flow .cj-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--cj-muted); padding: 0 12px 12px; }
#cb-journal-flow .cj-bar select { width: auto; max-width: 100%; }
#cb-journal-flow .cj-card { max-width: 640px; margin: 0 auto; padding: 12px; border: 1px solid var(--cj-border); border-left: 4px solid #b7ad87; border-radius: 8px; background: var(--cj-bg); color: var(--cj-ink); }
#cb-journal-flow .cj-gallery img { width: 100%; display: block; image-rendering: pixelated; border-radius: 4px; }
#cb-journal-flow .cj-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
#cb-journal-flow button { border: 0; border-radius: 4px; padding: 8px 12px; background: var(--cj-button); color: var(--cj-ink); font: inherit; font-weight: 500; max-width: 100%; }
#cb-journal-flow button[data-style="1"] { background: #5865f2; color: #fff; }
#cb-journal-flow button[data-style="3"] { background: light-dark(#257944, #278747); color: #fff; }
#cb-journal-flow button:disabled { opacity: .5; }
#cb-journal-flow select { appearance: auto; border: 1px solid var(--cj-border); border-radius: 4px; padding: 10px 8px; background: var(--cj-select); color: var(--cj-ink); font: inherit; width: 100%; min-width: 0; }
#cb-journal-flow .cj-text { margin: 12px 0; overflow-wrap: anywhere; }
#cb-journal-flow .cj-text h3 { font-size: 18px; line-height: 1.4; font-weight: 500; color: var(--cj-ink); margin: 0 0 6px; }
#cb-journal-flow .cj-text strong { font-weight: 500; }
#cb-journal-flow .cj-section { display: grid; grid-template-columns: 1fr 100px; gap: 14px; align-items: start; }
#cb-journal-flow .cj-section img { width: 100%; max-height: 100px; object-fit: contain; image-rendering: pixelated; }
#cb-journal-flow .cj-note { color: var(--cj-muted); padding: 10px 12px 0; min-height: 32px; }
@media (max-width: 420px) { #cb-journal-flow .cj-section { grid-template-columns: 1fr 78px; gap: 8px; } #cb-journal-flow button { padding: 8px; } }
@media (pointer: coarse) { #cb-journal-flow button, #cb-journal-flow select { min-height: 44px; } #cb-journal-flow select { font-size: 16px; } }
</style>

t": "### First Stitch\nMaren · Whispering Woods"}, {"type": 10, "content": "You find Maren mid-sentence, talking to her Barkley about something it clearly already knows.\n\nShe doesn't look up immediately.\n\nWhen she does: *'Oh good. Another one. Sit down — Barkley, move over — and tell me what you've seen so far.'*\n\n\n\nYou tell her you're just starting.\n\n\n\n*'Good,'* she says. *'Then you haven't learned any bad habits yet. I'm writing a new page of the Bestiary — the server's record of what exists here, officially. For that I need firsthand accounts. Not mine. I've been here too long. I see what I expect to see.'*\n\n\n\n*'Go out three times. Pick a path you want to know better. Catch three companions and tell me what meeting them felt like. That's the part that goes in the record.'*"}, {"type": 1, "components": [{"type": 2, "style": 2, "disabled": false, "label": "Hide dialogue", "custom_id": "journal:19b97aad9dd542d8b990fc40e84e66a2:story_dialogue:2"}]}, {"type": 10, "content": "**0/3** · Explore three times; choose your destination with /explore\n**0/3** · Catch 3 wild beasts"}, {"type": 1, "components": [{"type": 2, "style": 2, "disabled": false, "label": "Explore", "custom_id": "journal:19b97aad9dd542d8b990fc40e84e66a2:page:adventure:3"}, {"type": 2, "style": 2, "disabled": false, "label": "Workshop", "custom_id": "journal:19b97aad9dd542d8b990fc40e84e66a2:page:workshop:4"}]}]}]}, "legacy": {"roster": {"embed": {"footer": {"text": "Beast #1 · Companion actions for care, gear and growth. Details shows moves and lore."}, "image": {"url": "attachment://equipped-4b7db6bc3a3541fa9940.png"}, "fields": [{"inline": false, "name": "Stats", "value": "❤️ **HP:** 113/113\n⚔️ **ATK:** 52\n🛡️ **DEF:** 42\n💨 **SPD:** 87\n💠 **MANA:** 79/79"}, {"inline": false, "name": "Evolution · Timestitch", "value": "Reach beast level 15 first."}], "flags": 0, "color": 9807270, "type": "rich", "description": "Lv.8 · Bond 0/100 · Happiness 100/100\n**Active lead**", "title": "Twine ·   function component(item, parent) {
    if (item.type === 17) { for (const child of item.components) component(child, parent); return; }
    if (item.type === 12) { const gallery = document.createElement('div'); gallery.className = 'cj-gallery'; for (const media of item.items) { const img = document.createElement('img'); img.src = art[media.media.url.replace('attachment://', '')] || ''; img.alt = media.description || 'Field Journal'; gallery.append(img); } parent.append(gallery); return; }
    if (item.type === 10) { const text = document.createElement('div'); text.className = 'cj-text'; text.innerHTML = markdown(item.content); parent.append(text); return; }
    if (item.type === 1) { const row = document.createElement('div'); row.className = 'cj-row'; for (const child of item.components) component(child, row); parent.append(row); return; }
    if (item.type === 2) { const button = document.createElement('button'); button.type = 'button'; button.textContent = item.label; button.disabled = !!item.disabled; button.dataset.style = item.style; button.onclick = () => buttonAction(action(item.custom_id), item.label); parent.append(button); return; }
    if (item.type === 3) { const select = document.createElement('select'); select.setAttribute('aria-label', item.placeholder || 'Choose an option'); select.disabled = !!item.disabled; const placeholder = document.createElement('option'); placeholder.value = ''; placeholder.textContent = item.placeholder || 'Choose an option'; placeholder.disabled = true; select.append(placeholder); for (const entry of item.options) { const option = document.createElement('option'); option.value = entry.value; option.textContent = entry.label; option.selected = !!entry.default; select.append(option); } if (!item.options.some(option => option.default)) select.value = ''; select.onchange = () => selection(action(item.custom_id), select.value, item.placeholder); parent.append(select); return; }
    if (item.type === 9) { const section = document.createElement('div'); section.className = 'cj-section'; const text = document.createElement('div'); for (const child of item.components) component(child, text); section.append(text); const img = document.createElement('img'); img.src = art[item.accessory.media.url.replace('attachment://', '')] || ''; img.alt = item.accessory.description || 'Companion'; section.append(img); parent.append(section); }
  }
  function journal(payload) { const card = document.createElement('div'); card.className = 'cj-card'; card.dataset.message = 'journal'; for (const item of payload) component(item, card); stage.append(card); }
  function legacyPanel(panel) {
    const card = document.createElement('div'); card.className = 'cj-card'; card.dataset.message = 'panel';
    const embed = panel.embed, text = document.createElement('div'); text.className = 'cj-text';
    text.innerHTML = '<h3 style="display:block;margin-bottom:10px">' + html(embed.title || '') + '</h3><div>' + markdown(embed.description || '') + '</div>';
    for (const field of embed.fields || []) text.innerHTML += '<h4>' + html(field.name) + '</h4>' + markdown(field.value);
    card.append(text);
    if (embed.image) { const img = document.createElement('img'); img.src = art[embed.image.url.replace('attachment://', '')]; img.alt = embed.title || 'Companion'; img.style.cssText = 'display:block;max-width:230px;max-height:240px;margin:16px auto;image-rendering:pixelated'; card.append(img); }
    if (embed.footer) { const footer = document.createElement('p'); footer.className = 'cj-note'; footer.textContent = embed.footer.text; card.append(footer); }
    for (const item of panel.components) component(item, card); stage.append(card);
  }
  function label(text) { const item = document.createElement('p'); item.className = 'flow-label'; item.textContent = text; stage.append(item); }
  function render() {
    stage.replaceChildren(); root.dataset.flow = current;
    if (current === 'during_battle') {
      label('The saved journal waits while the encounter plays below it.'); journal(data.pages.during_battle);
      const battle = document.createElement('div'); battle.className = 'cj-card flow-battle'; battle.dataset.message = 'battle'; const img = document.createElement('img'); img.src = 'battle.png'; img.alt = 'Packaged battle renderer: Twine, Gloop and Barkley meet a wild Wisp'; battle.append(img); const button = document.createElement('button'); button.textContent = 'Finish sample encounter'; button.dataset.style = '3'; button.onclick = () => show('continued'); battle.append(button); stage.append(battle);
    } else if (current === 'continued') {
      label('Older journal removed · encounter result retained · one fresh journal at the bottom');
      const result = document.createElement('div'); result.className = 'cj-card flow-result'; result.dataset.message = 'result'; result.innerHTML = '<strong>Encounter complete</strong><p>' + html(data.result_note) + '</p>'; stage.append(result);
      journal(data.pages.continued);
    } else if (data.legacy[current]) legacyPanel(data.legacy[current]);
    else journal(current === 'edit_reserve' ? data.editors[role][candidate] : data.pages[current]);
    picker.value = current;
  }
  picker.onchange = () => show(picker.value);
  root.journalFlowPreview = {show, getState: () => ({page: current, role, candidate})};
  show('selection'); root.dataset.ready = 'true';
})();
