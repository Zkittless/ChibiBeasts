#cb-journal-flow { color-scheme: dark; --cj-bg: light-dark(#f2f3f5, #2b2d31); --cj-ink: light-dark(#303238, #dbdee1); --cj-muted: light-dark(#5c6068, #b5bac1); --cj-button: light-dark(#e3e5e8, #41434a); --cj-border: light-dark(#c4c7ce, #4e5058); --cj-select: light-dark(#fff, #1e1f22); font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5; }
#cb-journal-flow * { box-sizing: border-box; }
#cb-journal-flow .cj-stage { padding: 14px 0; }
#cb-journal-flow .cj-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--cj-muted); padding: 0 12px 12px; }
#cb-journal-flow .cj-bar select { width: auto; max-width: 100%; }
#cb-journal-flow .cj-card { max-width: 640px; margin: 0 auto; padding: 12px; border: 1px solid var(--cj-border); border-left: 4px solid #b7ad87; border-radius: 8px; background: var(--cj-bg); color: var(--cj-ink); }
#cb-journal-flow .cj-gallery img { width: 100%; display: block; image-rendering: pixelated; border-radius: 4px; }
#cb-journal-flow .cj-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
#cb-journal-flow button { border: 0; border-radius: 4px; padding: 8px 12px; background: var(--cj-button); color: var(--cj-ink); font: inherit; font-weight: 500; max-width: 100%; }
#cb-journal-flow button[data-style="1"] { background: #5865f2; color: #fff; }
#cb-journal-flow button[data-style="3"] { background: light-dark(#257944, #278747); color: #fff; }
#cb-journal-flow button:disabled { opacity: .5; }
#cb-journal-flow select { appearance: auto; border: 1px solid var(--cj-border); border-radius: 4px; padding: 10px 8px; background: var(--cj-select); color: var(--cj-ink); font: inherit; width: 100%; min-width: 0; }
#cb-journal-flow .cj-text { margin: 12px 0; overflow-wrap: anywhere; }
#cb-journal-flow .cj-text h3 { font-size: 18px; line-height: 1.4; font-weight: 500; color: var(--cj-ink); margin: 0 0 6px; }
#cb-journal-flow .cj-text strong { font-weight: 500; }
#cb-journal-flow .cj-section { display: grid; grid-template-columns: 1fr 100px; gap: 14px; align-items: start; }
#cb-journal-flow .cj-section img { width: 100%; max-height: 100px; object-fit: contain; image-rendering: pixelated; }
#cb-journal-flow .cj-note { color: var(--cj-muted); padding: 10px 12px 0; min-height: 32px; }
@media (max-width: 420px) { #cb-journal-flow .cj-section { grid-template-columns: 1fr 78px; gap: 8px; } #cb-journal-flow button { padding: 8px; } }
@media (pointer: coarse) { #cb-journal-flow button, #cb-journal-flow select { min-height: 44px; } #cb-journal-flow select { font-size: 16px; } }
</style>

      label('Older journal removed · encounter result retained · one fresh journal at the bottom');
      const result = document.createElement('div'); result.className = 'cj-card flow-result'; result.dataset.message = 'result'; result.innerHTML = '<strong>Encounter complete</strong><p>' + html(data.result_note) + '</p>'; stage.append(result);
      journal(data.pages.continued);
    } else journal(current === 'edit_reserve' ? data.editors[role][candidate] : data.pages[current]);
    picker.value = current;
  }
  picker.onchange = () => show(picker.value);
  root.journalFlowPreview = {show, getState: () => ({page: current, role, candidate})};
  show('team'); root.dataset.ready = 'true';
})();
